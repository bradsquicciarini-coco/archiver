[project]
name = "data-archiver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.42.10",
    "foxglove-sdk>=0.16.2",
    "grpcio-tools>=1.76.0",
    "mcap>=1.3.1",
    "mcap-protobuf-support>=0.5.4",
    "mcap-ros1-support>=0.7.4",
    "opencv-python>=4.12.0.88",
    "pandas>=2.3.3",
    "protobuf>=6.33.2",
    "pyarrow>=22.0.0",
    "redshift-connector[full]>=2.1.10",
    "scipy>=1.16.3",
    "shapely>=2.1.2",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pyproj>=3.7.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
