apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-archiver
  namespace: foxglove
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam:::role/device-service-account-role-development
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-archiver
  namespace: foxglove
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-archiver
  template:
    metadata:
      labels:
        app: data-archiver
    spec:
      serviceAccountName: data-archiver
      nodeSelector:
        spot: "yes"
      containers:
        - name: data-archiver
          image: 270582689972.dkr.ecr.us-west-2.amazonaws.com/data-archiver:cf338da
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_REGION
              value: us-west-2
            - name: QUEUE_URL
              value: https://sqs.us-west-2.amazonaws.com/270582689972/data-archiver-queue
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
